<p id="caption" aria-live="polite">Every clear day, an ocean of blue hangs above us. But sunlight arrives with a whole rainbow of colors, so where does the blue come from?</p>
<noscript><p>Every clear day, an ocean of blue hangs above us. But sunlight arrives with a whole rainbow of colors, so where does the blue come from?</p><p>Sunlight looks white because it contains many wavelengths. When it reaches Earth, it meets a thin atmosphere full of tiny gas molecules.</p><p>Zoom in on a molecule: its electric charges respond to passing light and reradiate some of it in new directions. This is scattering, and short wavelengths scatter much more strongly.</p><p>Rayleigh scattering grows roughly as one over wavelength to the fourth power. Blue light has a shorter wavelength than red, so it is scattered several times more strongly.</p><p>Violet light scatters even more strongly than blue. But our eyes are less sensitive to violet, and sunlight contains less of it: the mix we perceive is blue.</p><p>Across the whole sky, molecules send scattered blue light toward us from every direction. Near sunset, sunlight travels farther through the air, leaving more reds and oranges in the direct beam.</p><p>Sunlight brings the colors; tiny molecules scatter the shorter waves more strongly; our eyes turn that scattered mixture into a blue sky. Next time you look up, you are seeing light take a detour.</p></noscript></main>

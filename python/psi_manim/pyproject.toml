[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-manim"
version = "0.1.0"
description = "Intuition-first mathematical animation helpers for Manim Community"
requires-python = ">=3.10"
dependencies = ["manim>=0.18"]

[tool.setuptools]
packages = ["psi_manim"]
package-dir = {psi_manim = "."}

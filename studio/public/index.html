<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#13213D" media="(prefers-color-scheme: dark)">
	<title>psi</title>
	<meta name="application-name" content="psi web (ψ Studio)">

	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/bricolage-grotesque@5.1.1/opsz.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/atkinson-hyperlegible-next@5.2.4/index.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/atkinson-hyperlegible-next@5.2.4/700.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.1.1/index.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.1.1/700.min.css">
	<link rel="stylesheet" href="/styles.css">
	<link rel="stylesheet" href="/css/chat.css">
	<link rel="stylesheet" href="/css/widgets.css">
	<link rel="stylesheet" href="/css/practice.css">
	<link rel="stylesheet" href="/css/paths.css">
	<link rel="stylesheet" href="/css/graph.css">
	<link rel="stylesheet" href="/css/game.css">
	<script src="/app.js" type="module"></script>
</head>
<body data-bench="off">
	<a class="psi-skip" href="#app">Skip to content</a>
	<div class="psi-shell">
		<aside id="sidebar" class="psi-sidebar" aria-label="Navigation">
			<a class="psi-brand" href="#/" aria-label="psi home"><span class="psi-glyph" aria-hidden="true">ψ</span>psi</a>
			<a class="button psi-new-chat" href="#/new">New chat</a>
			<section class="psi-nav-section" aria-labelledby="nav-chats">
				<h2 id="nav-chats">Chats</h2>
				<nav id="saved-chats" class="psi-nav-list" aria-labelledby="nav-chats"></nav>
			</section>
			<section class="psi-nav-section" aria-labelledby="nav-skills">
				<h2 id="nav-skills">Skills</h2>
				<nav id="sidebar-skills" class="psi-nav-list" aria-labelledby="nav-skills"></nav>
			</section>
			<nav class="psi-nav-section psi-nav-list" aria-label="Your knowledge">
				<a class="psi-nav-row" href="#/graph"><span class="psi-row-title">Graph</span></a>
				<a class="psi-nav-row" href="#/paths"><span class="psi-row-title">Paths</span></a>
				<a class="psi-nav-row" href="#/you"><span class="psi-row-title">You</span></a>
				<a class="psi-nav-row" href="#/memory"><span class="psi-row-title">Memory</span></a>
			</nav>
			<section class="psi-nav-section psi-nav-concepts" aria-labelledby="nav-concepts">
				<h2 id="nav-concepts">Concepts</h2>
				<nav id="sidebar-topics" class="psi-nav-list" aria-labelledby="nav-concepts"></nav>
			</section>
			<p id="connection" class="psi-connection" role="status" hidden></p>
		</aside>
		<button id="drawer-shade" class="psi-shade" type="button" aria-label="Close panel" tabindex="-1" hidden></button>
		<div class="psi-main">
			<header class="psi-topbar">
				<button id="menu-toggle" class="psi-icon-button" type="button" aria-label="Open navigation" aria-controls="sidebar"
					aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
				<div class="psi-topbar-title"><strong id="topbar-title">psi</strong><span id="topbar-sub" hidden></span></div>
				<button id="bench-toggle" type="button" aria-controls="bench" aria-expanded="false" hidden>Progress</button>
			</header>
			<main id="app" tabindex="-1"><p class="empty psi-view">Opening psi…</p></main>
		</div>
		<aside id="bench" class="psi-bench" aria-label="Your progress"></aside>
	</div>
	<dialog id="lightbox" aria-label="Artifact viewer"><button id="close-lightbox" class="close" type="button" aria-label="Close viewer">Close</button><div id="lightbox-content"></div></dialog>
</body>
</html>
